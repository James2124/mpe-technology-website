name: Deploy staging to Shinjiru

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: shinjiru-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and upload staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MPE_STORAGE_DRIVER: file

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Prepare lightweight Shinjiru package
        run: |
          rm -rf dist/shinjiru
          mkdir -p dist/shinjiru/tmp
          cp -a dist/standalone/dist dist/shinjiru/dist
          cp -a dist/standalone/public dist/shinjiru/public
          cp dist/standalone/server.js dist/shinjiru/server.js
          cp deploy/shinjiru-package.json dist/shinjiru/package.json
          printf '%s\n' "$GITHUB_SHA" > dist/shinjiru/tmp/deployment.txt
          printf '%s\n' "$GITHUB_SHA" > dist/shinjiru-restart.txt

      - name: Install secure FTP client
        run: sudo apt-get update && sudo apt-get install --yes lftp
        
      - name: Check FTP hostname
        run: |
          echo "DNS:"
          getent ahostsv4 numbat.awedns.com

          echo "FTP port:"
          nc -vz -w 10 numbat.awedns.com 21

          echo "Certificate:"
          timeout 15 openssl s_client \
            -starttls ftp \
            -connect numbat.awedns.com:21 \
            -servername numbat.awedns.com \
            </dev/null 2>/dev/null |
          openssl x509 -noout -subject -issuer -ext subjectAltName
          
      - name: Upload standalone application
        env:
          FTP_HOST: ${{ secrets.SHINJIRU_FTP_HOST }}
          FTP_PORT: ${{ secrets.SHINJIRU_FTP_PORT }}
          FTP_USERNAME: ${{ secrets.SHINJIRU_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.SHINJIRU_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.SHINJIRU_FTP_REMOTE_DIR }}
        run: |
          : "${FTP_HOST:?Missing SHINJIRU_FTP_HOST}"
          : "${FTP_USERNAME:?Missing SHINJIRU_FTP_USERNAME}"
          : "${FTP_PASSWORD:?Missing SHINJIRU_FTP_PASSWORD}"
          : "${FTP_REMOTE_DIR:?Missing SHINJIRU_FTP_REMOTE_DIR}"
          FTP_PORT="${FTP_PORT:-21}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit true
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set mirror:set-permissions false

          pwd
          ls
          
          mirror --reverse --continue --verbose --parallel=1 --exclude-glob storage/** --exclude-glob .well-known/** --exclude-glob node_modules/** dist/shinjiru/ "$FTP_REMOTE_DIR"
          put -O "$FTP_REMOTE_DIR/tmp" -o restart.txt dist/shinjiru-restart.txt
          bye
          LFTP
