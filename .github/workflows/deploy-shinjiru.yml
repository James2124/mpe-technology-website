name: Deploy staging to Shinjiru

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: shinjiru-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and upload staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MPE_STORAGE_DRIVER: file

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Prepare Passenger restart marker
        run: |
          mkdir -p dist/standalone/tmp
          printf '%s\n' "$GITHUB_SHA" > dist/standalone/tmp/restart.txt

      - name: Install secure FTP client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Upload standalone application
        env:
          FTP_HOST: ${{ secrets.SHINJIRU_FTP_HOST }}
          FTP_PORT: ${{ secrets.SHINJIRU_FTP_PORT }}
          FTP_USERNAME: ${{ secrets.SHINJIRU_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.SHINJIRU_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.SHINJIRU_FTP_REMOTE_DIR }}
        run: |
          : "${FTP_HOST:?Missing SHINJIRU_FTP_HOST}"
          : "${FTP_USERNAME:?Missing SHINJIRU_FTP_USERNAME}"
          : "${FTP_PASSWORD:?Missing SHINJIRU_FTP_PASSWORD}"
          : "${FTP_REMOTE_DIR:?Missing SHINJIRU_FTP_REMOTE_DIR}"
          FTP_PORT="${FTP_PORT:-21}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit true
          set net:max-retries 20
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set net:timeout 60
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          mirror --reverse --continue --verbose --parallel=1 --exclude-glob storage/** --exclude-glob .well-known/** dist/standalone/ "$FTP_REMOTE_DIR"
          bye
          LFTP
