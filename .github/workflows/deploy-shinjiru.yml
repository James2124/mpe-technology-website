name: Build Shinjiru Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: shinjiru-runtime-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Shinjiru runtime
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      MPE_STORAGE_DRIVER: file

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build and test
        run: npm test

      - name: Prepare Shinjiru runtime
        run: |
          rm -rf dist/shinjiru
          mkdir -p dist/shinjiru/tmp

          cp -a dist/standalone/dist dist/shinjiru/dist
          cp -a dist/standalone/public dist/shinjiru/public
          cp dist/standalone/server.js dist/shinjiru/server.js
          cp deploy/shinjiru-package.json dist/shinjiru/package.json

          printf '%s\n' "$GITHUB_SHA" > dist/shinjiru/tmp/deployment.txt

      - name: Publish Shinjiru runtime to repository
        run: |
          rm -rf deploy/shinjiru-runtime
          mkdir -p deploy/shinjiru-runtime

          cp -a dist/shinjiru/. deploy/shinjiru-runtime/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A deploy/shinjiru-runtime

          echo "Runtime changes:"
          git status --short deploy/shinjiru-runtime

          if git diff --cached --quiet; then
            echo "Runtime has no changes. Nothing to commit."
          else
            git commit -m "Build Shinjiru runtime"
            git push origin HEAD:master
          fi
